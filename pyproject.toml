[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nova"
version = "0.1.0"
description = "NOVA Autonomous Trading System — Quantitative Research, Ingestion & Strategy Engine"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src", "kafka/src"]

[tool.pyright]
include = ["src", "tests", "scripts", "kafka/src"]
extraPaths = ["src", "kafka/src"]

[tool.pytest.ini_options]
testpaths = ["kafka/tests", "execution/tests", "tests"]
pythonpath = ["src", "kafka/src", "execution/src", "."]
