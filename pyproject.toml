[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nova"
version = "0.1.0"
description = "NOVA Autonomous Trading System — Quantitative Research, Ingestion & Strategy Engine"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src", "tests", "scripts"]
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
